<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
</head>
<body>
    <header>
        <h1>Categories</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/cart/">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>All Categories</h2>
        {% if categories %}
            <ul>
                {% for category in categories %}
                    <li>{{ category.name }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No categories available.</p>
        {% endif %}
    </main>
</body>
</html>
