<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f7f9fc;
        }

        .navbar {
            background-color: #004080;
            color: #fff;
            padding: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            margin-left: 1em;
            font-weight: bold;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2em;
        }

        form {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        form h2 {
            text-align: center;
            margin-bottom: 1.5em;
            color: #333;
        }

        label {
            font-weight: bold;
            margin-bottom: 0.5em;
            display: block;
            color: #333;
        }

        input {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        button {
            width: 100%;
            padding: 0.8em;
            border: none;
            background-color: #004080;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #003366;
        }

        .messages {
            margin-top: 1em;
        }

        .messages p {
            color: #d9534f;
            font-size: 0.9em;
            text-align: center;
        }

        .footer {
            background-color: #004080;
            color: #fff;
            text-align: center;
            padding: 1em 0;
            margin-top: auto;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .navbar ul {
                flex-direction: column;
                align-items: center;
            }

            .navbar a {
                margin: 0.5em 0;
            }

            form {
                padding: 1.5em;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">Store</div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/signup/">Signup</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <h2>Login</h2>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Store. All Rights Reserved.</p>
    </footer>
</body>
</html>
