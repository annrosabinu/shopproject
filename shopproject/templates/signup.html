<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Navbar Styles */
        nav {
            width: 100%;
            background-color: #333;
            padding: 10px 0;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #4CAF50;
        }

        /* Signup Container Styles */
        .signup-container {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .signup-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .signup-container form {
            display: flex;
            flex-direction: column;
        }

        .signup-container label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .signup-container input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .signup-container button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .signup-container button:hover {
            background-color: #45a049;
        }

        .messages {
            margin-top: 15px;
            color: red;
            font-size: 14px;
        }

        .messages ul {
            list-style-type: none;
            padding: 0;
        }

        .messages li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/signup">Sign Up</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </nav>

    <!-- Signup Form -->
    <div class="signup-container">
        <h1>Create a New Account</h1>
        <form method="POST">
            {% csrf_token %}
            <label for="uname">Username:</label>
            <input 
                type="text" 
                id="uname" 
                name="uname" 
                placeholder="Choose a username (max 6 characters)" 
                maxlength="6" 
                required>

            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Enter your email address" 
                required>

            <label for="pwd">Password:</label>
            <input 
                type="password" 
                id="pwd" 
                name="pwd" 
                placeholder="Enter a strong password" 
                pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}" 
                title="Password must be at least 6 characters long, contain a letter, a number, and a special character" 
                required>

            <label for="password_confirm">Confirm Password:</label>
            <input 
                type="password" 
                id="password_confirm" 
                name="password_confirm" 
                placeholder="Confirm your password" 
                required>

            <button type="submit">Sign Up</button>
        </form>

        {% if messages %}
            <div class="messages">
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    </div>

</body>
</html>
